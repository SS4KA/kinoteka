<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Кинотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="index.html">Киноте<span class="site-logo__accent">ка</span></a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item" data-auth="guest"><a class="site-nav__link" href="register.html">Регистрация</a></li>
          <li class="site-nav__item" data-auth="guest"><a class="site-nav__link" href="login.html" aria-current="page">Вход</a></li>
          <li class="site-nav__item" data-auth="user" hidden><a class="site-nav__link" href="profile.html">Профиль</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="auth">
      <div class="container container--narrow">
        <h1 class="page-title">Вход</h1>
        <p class="page-subtitle">Войдите в аккаунт, чтобы продолжить просмотр.</p>

        <p class="form-note" data-next-note hidden>Чтобы смотреть фильм, войдите в аккаунт или зарегистрируйтесь. Выбранный фильм откроется автоматически.</p>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="login-name">Логин</label>
            <input class="form-field__input" type="text" id="login-name" name="login-name" placeholder="Ваш логин" autocomplete="username" aria-describedby="login-name-error">
            <p class="form-field__error" id="login-name-error" role="alert"></p>
          </div>
          <div class="form-field">
            <label class="form-field__label" for="login-password">Пароль</label>
            <input class="form-field__input" type="password" id="login-password" name="login-password" placeholder="Ваш пароль" autocomplete="current-password" aria-describedby="login-password-error">
            <p class="form-field__error" id="login-password-error" role="alert"></p>
          </div>
          <button class="button button--primary button--full" type="submit">Войти</button>
          <p class="form-status" id="login-status" role="status"></p>
        </form>

        <p class="auth__switch">Нет аккаунта? <a class="link" href="register.html">Зарегистрироваться</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__text">© 2026 Кинотека.</p>
      <p class="site-footer__text">Онлайн-кинотеатр</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
