<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Кинотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="index.html">Киноте<span class="site-logo__accent">ка</span></a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item" data-auth="guest"><a class="site-nav__link" href="register.html" aria-current="page">Регистрация</a></li>
          <li class="site-nav__item" data-auth="guest"><a class="site-nav__link" href="login.html">Вход</a></li>
          <li class="site-nav__item" data-auth="user" hidden><a class="site-nav__link" href="profile.html">Профиль</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="auth">
      <div class="container container--narrow">
        <h1 class="page-title">Регистрация</h1>
        <p class="page-subtitle">Создайте аккаунт, чтобы смотреть фильмы онлайн.</p>

        <p class="form-note" data-next-note hidden>Чтобы смотреть фильм, войдите в аккаунт или зарегистрируйтесь. Выбранный фильм откроется автоматически.</p>

        <form class="auth-form" id="register-form" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="fullname">ФИО</label>
            <input class="form-field__input" type="text" id="fullname" name="fullname" placeholder="Иванов Иван Иванович" autocomplete="name" aria-describedby="fullname-error">
            <p class="form-field__error" id="fullname-error" role="alert"></p>
          </div>
          <div class="form-field">
            <label class="form-field__label" for="email">Email</label>
            <input class="form-field__input" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" aria-describedby="email-error">
            <p class="form-field__error" id="email-error" role="alert"></p>
          </div>
          <div class="form-field">
            <label class="form-field__label" for="login">Логин</label>
            <input class="form-field__input" type="text" id="login" name="login" placeholder="ivan_2026" autocomplete="username" aria-describedby="login-error">
            <p class="form-field__error" id="login-error" role="alert"></p>
          </div>
          <div class="form-field">
            <label class="form-field__label" for="password">Пароль</label>
            <input class="form-field__input" type="password" id="password" name="password" placeholder="Не менее 8 символов" autocomplete="new-password" aria-describedby="password-error">
            <p class="form-field__error" id="password-error" role="alert"></p>
          </div>
          <div class="form-field">
            <label class="form-field__label" for="password-repeat">Повтор пароля</label>
            <input class="form-field__input" type="password" id="password-repeat" name="password-repeat" placeholder="Введите пароль ещё раз" autocomplete="new-password" aria-describedby="password-repeat-error">
            <p class="form-field__error" id="password-repeat-error" role="alert"></p>
          </div>
          <button class="button button--primary button--full" type="submit">Зарегистрироваться</button>
          <p class="form-status" id="register-status" role="status"></p>
        </form>

        <p class="auth__switch">Уже есть аккаунт? <a class="link" href="login.html">Войти</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__text">© 2026 Кинотека.</p>
      <p class="site-footer__text">Онлайн-кинотеатр</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
